<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LH Games - login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">

                <a class="navbar-brand" href="index.html">
                    <img src="img/logo.png">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="login.html">Login</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>

    <main>

        <section id="section-login" class="container mt-5">
            <h1 class="text-center mb-4">Login</h1>
            <div class="d-flex justify-content-center">
                <form method="post" action="" id="login">
                    <p>
                        <label for="usuario">Nome: </label>
                        <input id="usuario" name="usuario" required="required" type="text"
                            placeholder="Insira o seu usuário" class="form-control" />
                    </p>
                    <p>
                        <label for="senha">Senha: </label>
                        <input id="senha" name="senha" required="required" type="password"
                            placeholder="Insira a sua senha" class="form-control" />
                    </p>
                    <p class="text-center">
                        <input type="button" value="Login" class="btn btn-primary" id="bt-login"
                            onclick="login()" />
                    </p>
                </form>
            </div>
        </section>

        <section id="section-cadastro" class="container mt-5">
            <div id="botao-cadastrar" class="text-center mb-4">
                <button type="button" class="btn btn-info">
                    Não é cadastrado ainda? Cadastre-se
                </button>
            </div>

            <div id="form-cadastrar">

                <h1 class="text-center">Criar minha conta</h1>
                <p class="text-center">Informe os seus dados abaixo para criar sua conta.</p>

                <div class="d-flex justify-content-center">
                    <form method="post" action="">
                        <p>
                            <label for="usuario2">Usuário: </label>
                            <input id="usuario2" name="usuario" required="required" type="text"
                                placeholder="ex. nome de usuário" class="form-control" />
                        </p>
                        <p>
                            <label for="email">E-mail: </label>
                            <input id="email" name="email" required="required" type="email"
                                placeholder="seu@email.com.br" class="form-control" />
                        </p>
                        <p>
                            <label for="senha2">Senha: </label>
                            <input id="senha2" name="senha" required="required" type="password"
                                placeholder="mínimo de 6 caracteres" class="form-control" />
                        </p>
                        <p class="text-center">
                            <input type="button" value="Cadastrar" class="btn btn-primary"
                                id="bt-cadastrar" onclick="cadastro()" />
                        </p>
                    </form>
                </div>

            </div>
        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        © 2026 LH Games - Todos os direitos reservados
    </footer>

    <button id="voltar-topo" type="button" class="btn btn-outline-primary">
        &uarr; Voltar ao topo
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
        crossorigin="anonymous"></script>

    <script src="js/script.js"></script>

    <script src="https://code.jquery.com/jquery-3.6.1.js"
        integrity="sha256-3zlB5s2uwoUzrXK3BT7AX3FyvojsraNFxCc2vC/7pNI=" crossorigin="anonymous"></script>

    <script type="text/javascript" src="js/jquery-script.js"></script>

</body>

</html>
